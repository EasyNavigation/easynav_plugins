controller_node:
  ros__parameters:
    use_sim_time: true
    colision_checker:
      active: true
      debug_markers: true
      downsample_leaf_size: 0.05
      robot_radius: 0.30
      brake_acc: 1.0
      safety_margin: 0.05
    # Robot velocity/acceleration limits: the controller plugins use them, and the velocity
    # smoother enforces them on every command published (see ControllerNode).
    robot_limits:
      max_linear_vel: 0.6
      min_linear_vel: -0.3
      max_angular_vel: 1.2
      max_linear_acc: 1.0
      max_linear_decel: 1.0
      max_angular_acc: 2.0
      max_angular_decel: 2.0
    controller_types: [rpp]
    rpp:
      rt_freq: 30.0
      plugin: easynav_regulated_pp_controller/RegulatedPurePursuitController
      use_dynamic_window: false
      allow_reversing: false
      # Lookahead
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.2
      use_velocity_scaled_lookahead_dist: true
      # Rotate to heading
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785
      # Curvature regulation
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.15
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 1.0
      interpolate_curvature_after_goal: false
      # Obstacle-proximity regulation (EasyNav's point-cloud based equivalent of Nav2's cost-based term)
      use_obstacle_regulated_linear_velocity_scaling: true
      obstacle_scaling_dist: 0.4
      obstacle_scaling_gain: 0.8
      # Approach to goal
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      # Goal tolerances (matching the serest config: 0.1 m / 6 deg)
      xy_goal_tolerance: 0.1
      yaw_goal_tolerance: 0.105

localizer_node:
  ros__parameters:
    use_sim_time: true
    localizer_types: [costmap]
    costmap:
      rt_freq: 50.0
      freq: 5.0
      reseed_freq: 1.0
      plugin: easynav_costmap_localizer/AMCLLocalizer
      num_particles: 100
      noise_translation: 0.05
      noise_rotation: 0.1
      noise_translation_to_rotation: 0.1
      initial_pose:
        x: 0.0
        y: 0.1
        yaw: 0.0
        std_dev_xy: 0.1
        std_dev_yaw: 0.01

maps_manager_node:
  ros__parameters:
    use_sim_time: true
    map_types: [costmap]
    costmap:
      freq: 10.0 
      plugin: easynav_costmap_maps_manager/CostmapMapsManager
      package: easynav_indoor_testcase
      map_path_file: maps/home2.yaml
      filters: [obstacles, inflation]
      obstacles:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/ObstaclesFilter
      inflation:
        plugin: easynav_costmap_maps_manager/CostmapMapsManager/InflationFilter
        inflation_radius: 1.3
        inscribed_radius: 0.25
        cost_scaling_factor: 3.0

planner_node:
  ros__parameters:
    use_sim_time: true
    planner_types: [simple]
    simple:
      freq: 0.5
      plugin: easynav_costmap_planner/CostmapPlanner
      cost_factor: 10.0
      continuous_replan: true

sensors_node:
  ros__parameters:
    use_sim_time: true
    forget_time: 0.5
    sensors: [laser1]
    laser1:
      topic: scan_raw
      type: sensor_msgs/msg/LaserScan

system_node:
  ros__parameters:
    use_sim_time: true
    use_real_time: true
    position_tolerance: 0.3
    angle_tolerance: 0.15

recovery_node:
  ros__parameters:
    use_sim_time: true
    # Recovery system: a RecoveryManagerBase plugin, with its own parameters below it.
    # SimpleRecoveryManager: brakes before an obstacle ahead, rotates to relocalize, backs up when
    # stuck, and aborts the mission or terminates EasyNav when that is not enough.
    recovery_manager:
      plugin: easynav_simple_recovery/SimpleRecoveryManager
      robot_radius: 0.30
      stop_distance: 0.3          # brake if an obstacle is this close ahead (beyond robot_radius)
      min_obstacle_z: 0.05
      max_obstacle_z: 2.0
      sensors_timeout: 5.0        # s without sensor data: terminate EasyNav
      max_position_variance: 1.0  # m^2 in x or y: localization lost
      relocalize_timeout: 20.0
      rotate_speed: 0.3
      stuck_time: 10.0
      stuck_distance: 0.05
      backup_speed: 0.1
      backup_time: 2.0
      max_backup_attempts: 3
      slow_down_max_linear_vel: 0.1  # still stuck after the attempts: slow down, then abort
